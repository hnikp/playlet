# Rows of the Chess page (FeedScreen): live chess streams, then the latest
# uploads of well-known chess channels. Channel names are not translated.
# "Live now" uses ChessLiveHandler (instead of the search endpoint's handler) to
# drop non-chess games (Auto Chess, Magic Chess...).
- title: Live now
  id: chess_live
  feedSources:
    - id: inv_search_chess_live
      title: Live now
      apiType: Invidious
      endpoint: search
      responseHandler: ChessLiveHandler
      queryParams:
        q: chess
        features: live
        sort: views
        type: video

- title: FIDE
  id: chess_channel_UC9B47GnzCRFHTT1BIBWvStQ
  feedSources:
    - id: inv_channel_videos_UC9B47GnzCRFHTT1BIBWvStQ
      title: FIDE
      apiType: Invidious
      endpoint: channel_videos
      pathParams:
        ucid: UC9B47GnzCRFHTT1BIBWvStQ
      queryParams:
        sort_by: newest

