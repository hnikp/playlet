# Rows of the Chess page (FeedScreen): this week's most viewed chess videos from
# any channel, live chess streams, the top recent videos
# of all the channels below, then the latest uploads of each well-known chess
# channel. Channel names are not translated.
# "Hot this week" and "Live now" use ChessHandler (instead of the search endpoint's handler) to
# drop non-chess games and shows (Auto Chess, Magic Chess, magnetic chess...), shorts and
# repeated titles; liveOnly keeps only the live videos.
# "Top recent" (ranked_channel_videos, RankedChannelVideosHandler) fetches the
# latest videos of each channel in "channels" and ranks them with FeedRanking:
# views relative to the channel's usual reach, decayed by age. Keep its channel
# list in sync with the channel rows.
- title: Hot this week
  id: chess_hot
  feedSources:
    - id: inv_search_chess_hot
      title: Hot this week
      apiType: Invidious
      endpoint: search
      responseHandler: ChessHandler
      queryParams:
        q: chess
        date: week
        sort: views
        type: video

- title: Live now
  id: chess_live
  feedSources:
    - id: inv_search_chess_live
      title: Live now
      apiType: Invidious
      endpoint: search
      responseHandler: ChessHandler
      liveOnly: true
      queryParams:
        q: chess
        features: live
        sort: views
        type: video

- title: Top recent
  id: chess_top_recent
  feedSources:
    - id: inv_ranked_chess
      title: Top recent
      apiType: Invidious
      endpoint: ranked_channel_videos
      channels:
        - ucid: UC9B47GnzCRFHTT1BIBWvStQ
          name: "FIDE"
        - ucid: UC5kS0l76kC0xOzMPtOmSFGw
          name: "Chess.com"
        - ucid: UCM-ONC2bCHytG2mYtKDmIeA
          name: "Saint Louis Chess Club"
        - ucid: UCkTCNuQ2mGfW6-SpHpaze_g
          name: "chess24"
        - ucid: UCQHX6ViZmPsWiYSFAyS0a3Q
          name: "GothamChess"
        - ucid: UCweCc7bSMX5J4jEH7HFImng
          name: "GMHikaru"
        - ucid: UCOVfq3NNYjlYCz1iou69FwQ
          name: "Anna Cramling"
        - ucid: UCL5YbN5WLFD8dLIegT5QAbA
